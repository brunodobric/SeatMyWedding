# Xcode projekt se generira iz ove datoteke alatom XcodeGen, da ga ne treba
# održavati ručno i da nema sukoba u .pbxproj datoteci:
#
#   brew install xcodegen
#   cd ios-native && xcodegen generate && open SeatMyWedding.xcodeproj
name: SeatMyWedding
options:
  bundleIdPrefix: com.seatmywedding
  developmentLanguage: hr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SeatingCore:
    path: SeatingCore
# Izričita shema aplikacije, i to prva na popisu: inače Xcode (nakon svakog novog generiranja
# projekta) kao zadanu odabere shemu paketa SeatingCore, koja se ne može pokrenuti.
schemes:
  SeatMyWedding:
    build:
      targets:
        SeatMyWedding: all
    run:
      config: Debug
    test:
      config: Debug
    management:
      shared: true
      orderHint: 0
targets:
  SeatMyWedding:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: SeatingCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SeatMyWedding
        # Jezici aplikacije (App/hr.lproj, App/en.lproj). Uz više jezika iOS u
        # Postavke → SeatMyWedding nudi izbor jezika samo za ovu aplikaciju.
        CFBundleLocalizations:
          - hr
          - en
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # iPad: više prozora aplikacije (npr. gosti u jednom, sala u drugom); iPhone ovo ne koristi.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
    # iCloud (CloudKit) je pripremljen, ali isključen dok nema plaćenog Apple Developer računa
    # (CloudSync.isAvailable = false). Za uključivanje odkomentiraj ovo (UIBackgroundModes ide
    # pod info.properties) i stavi isAvailable = true:
    #
    #     UIBackgroundModes:
    #       - remote-notification
    # entitlements:
    #   path: App/SeatMyWedding.entitlements
    #   properties:
    #     aps-environment: development
    #     com.apple.developer.icloud-container-identifiers:
    #       - iCloud.com.seatmywedding.app
    #     com.apple.developer.icloud-services:
    #       - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seatmywedding.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Tvoj Personal Team: bez ovoga XcodeGen pri svakom generiranju briše odabir tima u Xcodeu.
        DEVELOPMENT_TEAM: Z66L4S538M
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
