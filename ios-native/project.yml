# Xcode projekt se generira iz ove datoteke alatom XcodeGen, da ga ne treba
# održavati ručno i da nema sukoba u .pbxproj datoteci:
#
#   brew install xcodegen
#   cd ios-native && xcodegen generate && open SeatMyWedding.xcodeproj
name: SeatMyWedding
options:
  bundleIdPrefix: com.seatmywedding
  developmentLanguage: hr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SeatingCore:
    path: SeatingCore
targets:
  SeatMyWedding:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: SeatingCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SeatMyWedding
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seatmywedding.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
