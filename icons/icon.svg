<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C86E"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#A17C33"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F5EBDD"/>
    </linearGradient>
    <clipPath id="clip"><rect width="192" height="192" rx="32"/></clipPath>
    <g id="fl">
      <g fill="#FFFFFF" stroke="#E8DFC9" stroke-width="0.7">
        <ellipse cx="0" cy="-8" rx="4.4" ry="7"/>
        <ellipse cx="0" cy="-8" rx="4.4" ry="7" transform="rotate(72)"/>
        <ellipse cx="0" cy="-8" rx="4.4" ry="7" transform="rotate(144)"/>
        <ellipse cx="0" cy="-8" rx="4.4" ry="7" transform="rotate(216)"/>
        <ellipse cx="0" cy="-8" rx="4.4" ry="7" transform="rotate(288)"/>
      </g>
      <circle r="2.8" fill="url(#gold)"/>
    </g>
    <g id="ch">
