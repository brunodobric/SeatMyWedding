    <use xlink:href="#pl" transform="translate(66 96)"/>
    <use xlink:href="#pl" transform="translate(74.8 74.8)"/>
    <use xlink:href="#pl" transform="translate(96 66)"/>
    <use xlink:href="#pl" transform="translate(117.2 74.8)"/>
